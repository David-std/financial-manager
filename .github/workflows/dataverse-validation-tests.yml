name: Dataverse validation tests

on:
  push:
    branches: [develop]
    paths:
      - "plugins/FinancialManager.Validation/**"
      - "tests/FinancialManager.Validation.Tests/**"
      - "tools/DataverseDeployment/**"
      - "power-platform/solutions/FinancialManager/src/**"
      - ".github/workflows/dataverse-validation-tests.yml"
  pull_request:
    paths:
      - "plugins/FinancialManager.Validation/**"
      - "tests/FinancialManager.Validation.Tests/**"
      - "tools/DataverseDeployment/**"
      - "power-platform/solutions/FinancialManager/src/**"
      - ".github/workflows/dataverse-validation-tests.yml"

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify source-controlled financial tables
        shell: pwsh
        run: |
          foreach ($name in @("fmg_Budget", "fmg_BudgetAllocation", "fmg_ActivityEvent")) {
            $path = "power-platform/solutions/FinancialManager/src/Entities/$name/Entity.xml"
            if (-not (Test-Path $path)) { throw "Missing exported table: $name" }
          }
      - name: Build Dataverse deployment and integration verifier
        run: dotnet build tools/DataverseDeployment/DataverseDeployment.csproj --configuration Release --nologo
      - name: Run tests
        run: dotnet test tests/FinancialManager.Validation.Tests/FinancialManager.Validation.Tests.csproj --configuration Release --verbosity normal
