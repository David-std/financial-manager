name: Dataverse validation tests

on:
  push:
    branches: [develop]
    paths:
      - "plugins/FinancialManager.Validation/**"
      - "plugins/FinancialManager.BudgetIntegrity/**"
      - "plugins/FinancialManager.CashIntegrity/**"
      - "plugins/FinancialManager.CashOperations/**"
      - "plugins/FinancialManager.CashAccessIntegrity/**"
      - "src/FinancialManager.CashDomain/**"
      - "tests/FinancialManager.Validation.Tests/**"
      - "tests/FinancialManager.BudgetIntegrity.Tests/**"
      - "tests/FinancialManager.CashIntegrity.Tests/**"
      - "tests/FinancialManager.CashDomain.Tests/**"
      - "tests/FinancialManager.CashOperations.Tests/**"
      - "tests/FinancialManager.CashAccessIntegrity.Tests/**"
      - "tools/DataverseDeployment/**"
      - "power-platform/solutions/FinancialManager/src/**"
      - ".github/workflows/dataverse-validation-tests.yml"
  pull_request:
    paths:
      - "plugins/FinancialManager.Validation/**"
      - "plugins/FinancialManager.BudgetIntegrity/**"
      - "plugins/FinancialManager.CashIntegrity/**"
      - "plugins/FinancialManager.CashOperations/**"
      - "plugins/FinancialManager.CashAccessIntegrity/**"
      - "src/FinancialManager.CashDomain/**"
      - "tests/FinancialManager.Validation.Tests/**"
      - "tests/FinancialManager.BudgetIntegrity.Tests/**"
      - "tests/FinancialManager.CashIntegrity.Tests/**"
      - "tests/FinancialManager.CashDomain.Tests/**"
      - "tests/FinancialManager.CashOperations.Tests/**"
      - "tests/FinancialManager.CashAccessIntegrity.Tests/**"
      - "tools/DataverseDeployment/**"
      - "power-platform/solutions/FinancialManager/src/**"
      - ".github/workflows/dataverse-validation-tests.yml"

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify source-controlled financial tables
        shell: pwsh
        run: |
          foreach ($name in @("fmg_Budget", "fmg_BudgetAllocation", "fmg_ActivityEvent")) {
            $path = "power-platform/solutions/FinancialManager/src/Entities/$name/Entity.xml"
            if (-not (Test-Path $path)) { throw "Missing exported table: $name" }
          }
      - name: Build Dataverse deployment and integration verifier
        run: dotnet build tools/DataverseDeployment/DataverseDeployment.csproj --configuration Release --nologo
      - name: Test payments
        run: dotnet test tests/FinancialManager.Validation.Tests/FinancialManager.Validation.Tests.csproj --configuration Release --verbosity normal
      - name: Test budgets and activity events
        run: dotnet test tests/FinancialManager.BudgetIntegrity.Tests/FinancialManager.BudgetIntegrity.Tests.csproj --configuration Release --verbosity normal
      - name: Test F5 cash-domain fail-closed guards
        run: dotnet test tests/FinancialManager.CashIntegrity.Tests/FinancialManager.CashIntegrity.Tests.csproj --configuration Release --verbosity normal
      - name: Test source-only F5 cash operation policies
        run: dotnet test tests/FinancialManager.CashDomain.Tests/FinancialManager.CashDomain.Tests.csproj --configuration Release --verbosity normal
      - name: Test F5 read-only runtime probe package
        run: dotnet test tests/FinancialManager.CashOperations.Tests/FinancialManager.CashOperations.Tests.csproj --configuration Release --verbosity normal
      - name: Test F5 cash access grant hard-deny guard
        run: dotnet test tests/FinancialManager.CashAccessIntegrity.Tests/FinancialManager.CashAccessIntegrity.Tests.csproj --configuration Release --verbosity normal
