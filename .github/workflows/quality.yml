name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validation tests
        run: python -m unittest discover -s tests -v
      - name: Check repository content
        run: python scripts/check_repository.py
      - name: Check Power Apps navigation and financial UI guardrails
        run: python scripts/check_model_app.py
      - name: Set up Node for source formatting
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Enforce Power Apps TSX formatting
        run: npm run check:format
      - name: Enforce React workspace TSX, CSS and test formatting
        run: npm run check:workspace
      - name: Install workspace dependencies
        run: npm ci --prefix apps/financial-workspace
      - name: Compile offline workspace
        run: npm run build --prefix apps/financial-workspace
      - name: Verify finance access contracts and analytics
        run: |
          npm run test:contracts --prefix apps/financial-workspace
          npm run test:transport --prefix apps/financial-workspace
          npm run test:concurrency --prefix apps/financial-workspace
          npm run test:analytics --prefix apps/financial-workspace
      - name: Resolve headless browser for workspace acceptance
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -n "$browser" ]]; then
            echo "WORKSPACE_BROWSER=$browser" >> "$GITHUB_ENV"
            echo "Using runner browser: $browser"
          else
            echo "No runner Chromium-compatible browser detected; installing fallback."
            node apps/financial-workspace/node_modules/playwright-core/cli.js install --with-deps chromium
          fi
      - name: Verify workspace navigation and responsive layout
        run: |
          npm run preview --prefix apps/financial-workspace -- --host 127.0.0.1 --port 5178 --strictPort &
          sleep 4
          WORKSPACE_URL=http://127.0.0.1:5178/ node apps/financial-workspace/smoke.mjs
